<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condomínios Malate - Gestão</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --primary: #10b981; --primary-dark: #059669; --bg: #f0fdf4; 
            --white: #ffffff; --text: #1f2937; --border: #d1fae5; --danger: #f43f5e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 50px; }

        #login-overlay { position: fixed; inset: 0; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: var(--white); padding: 40px; border-radius: 20px; text-align: center; width: 90%; max-width: 380px; box-shadow: 0 20px 25px rgba(0,0,0,0.1); }
        .login-input { width: 100%; padding: 14px; margin-top: 10px; border: 2px solid var(--border); border-radius: 12px; font-size: 16px; }
        .btn-access { background: none; border: none; color: #6b7280; font-size: 12px; margin-top: 15px; cursor: pointer; text-decoration: underline; }

        header { background: var(--white); padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 99; }
        .logo-text { font-weight: 800; color: var(--primary-dark); font-size: 22px; }

        main { padding: 20px 5%; }
        .prop-section { margin-top: 40px; }
        .prop-title { background: var(--primary); color: white; padding: 12px 25px; border-radius: 12px 12px 0 0; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .btn-edit-title { background: none; border: none; color: white; cursor: pointer; }

        .table-card { background: var(--white); border-radius: 0 15px 15px 15px; padding: 20px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1650px; }
        th { text-align: left; padding: 14px; background: #f9fafb; font-size: 11px; color: #6b7280; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid var(--bg); font-size: 14px; }

        .gaveta { padding: 7px; border-radius: 8px; border: 1px solid var(--border); font-size: 12px; font-weight: bold; cursor: pointer; }
        .st-Pago { background: #d1fae5; color: #065f46; }
        .st-NaoPago { background: #ffe4e6; color: #9f1239; }
        .st-Pendente { background: #fef3c7; color: #92400e; }

        .notas-gerais-section { margin: 40px 5%; padding: 20px; background: #fff; border-radius: 15px; border: 2px solid var(--primary); }
        #notas-gerais-textarea { width: 100%; min-height: 150px; padding: 15px; border-radius: 10px; border: 1px solid var(--border); font-size: 16px; outline: none; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2 id="login-title">Condomínios Malate</h2>
            <input type="text" id="user" class="login-input" placeholder="Usuário">
            <input type="password" id="pass" class="login-input" placeholder="Senha">
            <button onclick="realizarLogin()" id="btn-login-text" style="width:100%; margin-top:20px; padding:16px; background:var(--primary); color:white; border:none; border-radius:12px; font-weight:bold; cursor:pointer;">Entrar</button>
            <button class="btn-access" onclick="alterarAcessoUniversal()" id="btn-change-access">Alterar Usuário/Senha para TODOS</button>
        </div>
    </div>

    <header>
        <div class="logo-text" id="header-logo">CONDOMÍNIOS MALATE</div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <button onclick="alternarIdioma()" id="btn-lang" style="background:var(--primary); color:white; border:none; padding:8px 15px; border-radius:8px; font-weight:bold; cursor:pointer;">DEUTSCH 🇩🇪</button>
            <button onclick="location.reload()" style="background:none; border:none; color:var(--danger); cursor:pointer;"><i class="ph ph-power" style="font-size: 26px;"></i></button>
        </div>
    </header>

    <main id="main-content"></main>

    <div class="notas-gerais-section">
        <h3 id="notas-title" style="margin-bottom:10px;">NOTAS GERAIS</h3>
        <textarea id="notas-gerais-textarea" onblur="salvarNotasNoSB(this.value)"></textarea>
    </div>

    <script>
        const SB_URL = 'https://dwznzdnvtezhkqzqwrsa.supabase.co'; 
        const SB_KEY = 'sb_publishable_ZajKS3fZjhbLeGLdo-2IsA_sQgarlui';
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        let idiomaAtual = 'pt';
        const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set_','out_','nov','dez'];

        const dic = {
            pt: {
                loginTitle: "Condomínios Malate", btnLogin: "Entrar", btnAccess: "Alterar Usuário/Senha (Global)",
                header: "CONDOMÍNIOS MALATE", notas: "NOTAS GERAIS E OBSERVAÇÕES",
                th: ["ID", "Nome Cliente", "Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez", "Apt", "Contacto", "Renda", "Notas"],
                st: ["Pendente", "Pago", "Não pago"], placeholderNota: "Escreva aqui..."
            },
            de: {
                loginTitle: "Malate Wohnanlagen", btnLogin: "Einloggen", btnAccess: "Zugangsdaten für ALLE ändern",
                header: "MALATE WOHNANLAGEN", notas: "ALLGEMEINE NOTIZEN UND BEMERKUNGEN",
                th: ["ID", "Kundenname", "Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez", "Whg", "Kontakt", "Miete", "Notizen"],
                st: ["Ausstehend", "Bezahlt", "Nicht bezahlt"], placeholderNota: "Schreiben Sie hier..."
            }
        };

        const geoTraducoes = {
            "Condomínio": "Wohnanlage", "Casa": "Haus", "Apartamento": "Wohnung", "Cidade": "Stadt",
            "Grande": "Groß", "Loja": "Geschäft", "Benfica": "Benfica (Bezirk)", "Choupal": "Choupal (Viertel)"
        };

        function traduzirTexto(texto) {
            if (idiomaAtual === 'pt') return texto;
            let traduzido = texto;
            for (const [pt, de] of Object.entries(geoTraducoes)) {
                const regex = new RegExp(pt, 'gi');
                traduzido = traduzido.replace(regex, de);
            }
            return traduzido;
        }

        async function realizarLogin() {
            const userIn = document.getElementById('user').value;
            const passIn = document.getElementById('pass').value;

            let { data } = await _supabase.from('acesso_sistema').select('*').eq('id', 1).single();

            if(userIn === data.usuario && passIn === data.senha) {
                document.getElementById('login-overlay').style.display = 'none';
                carregarTudo();
            } else { alert('Acesso negado!'); }
        }

        async function alterarAcessoUniversal() {
            const atual = prompt("Digite a SENHA ATUAL para autorizar a mudança:");
            let { data } = await _supabase.from('acesso_sistema').select('senha').eq('id', 1).single();
            
            if(atual === data.senha) {
                const novoU = prompt("Novo usuário para todos:");
                const novoP = prompt("Nova senha para todos:");
                if(novoU && novoP) {
                    await _supabase.from('acesso_sistema').update({ usuario: novoU, senha: novoP }).eq('id', 1);
                    alert("Acesso atualizado no servidor para todos os usuários!");
                }
            } else { alert("Senha atual incorreta. Não autorizado."); }
        }

        async function carregarTudo() {
            const container = document.getElementById('main-content');
            document.getElementById('header-logo').innerText = dic[idiomaAtual].header;
            document.getElementById('notas-title').innerText = dic[idiomaAtual].notas;
            document.getElementById('notas-gerais-textarea').placeholder = dic[idiomaAtual].placeholderNota;

            let { data } = await _supabase.from('condominio_verde').select('*').order('id', { ascending: true });
            const grupos = data.reduce((acc, item) => {
                if (!acc[item.propriedade]) acc[item.propriedade] = [];
                acc[item.propriedade].push(item);
                return acc;
            }, {});

            container.innerHTML = '';
            for (const prop in grupos) {
                const nomeExibicao = traduzirTexto(prop);
                let ths = '';
                dic[idiomaAtual].th.forEach(t => ths += `<th>${t}</th>`);

                let html = `
                <div class="prop-section">
                    <div class="prop-title">
                        <span>${nomeExibicao}</span>
                        <button class="btn-edit-title" onclick="editarNomeProp('${prop}')"><i class="ph ph-pencil"></i></button>
                    </div>
                    <div class="table-card">
                        <table>
                            <thead><tr>${ths}</tr></thead>
                            <tbody>`;
                
                grupos[prop].forEach(u => {
                    let colMeses = '';
                    meses.forEach(m => {
                        const status = u[m] || 'Pendente';
                        const idx = status === 'Pendente' ? 0 : (status === 'Pago' ? 1 : 2);
                        colMeses += `<td><select class="gaveta st-${status.replace(' ', '')}" onchange="atualizarStatus(${u.id},'${m}',this)">
                            <option value="Pendente" ${status==='Pendente'?'selected':''}>${dic[idiomaAtual].st[0]}</option>
                            <option value="Pago" ${status==='Pago'?'selected':''}>${dic[idiomaAtual].st[1]}</option>
                            <option value="Não pago" ${status==='Não pago'?'selected':''}>${dic[idiomaAtual].st[2]}</option>
                        </select></td>`;
                    });
                    // --- INÍCIO DA CORREÇÃO ---
                    // Adicionado '|| ""' para garantir que o valor nunca seja nulo/undefined,
                    // assegurando que o <span> seja sempre renderizado.
                    html += `<tr>
                        <td>${u.id}</td>
                        <td><span contenteditable="true" onblur="salvar(${u.id},'nome_cliente',this)">${u.nome_cliente || ''}</span></td>
                        ${colMeses}
                        <td><span contenteditable="true" onblur="salvar(${u.id},'apartamento',this)">${u.apartamento || ''}</span></td>
                        <td><span contenteditable="true" onblur="salvar(${u.id},'contacto',this)">${u.contacto || ''}</span></td>
                        <td><span contenteditable="true" onblur="salvar(${u.id},'renda',this)">${u.renda || ''}</span></td>
                        <td><span contenteditable="true" onblur="salvar(${u.id},'notas',this)">${u.notas || ''}</span></td>
                    </tr>`;
                    // --- FIM DA CORREÇÃO ---
                });
                container.innerHTML += html + `</tbody></table></div></div>`;
            }
            carregarNotasDoSB();
        }

        async function editarNomeProp(velho) {
            const novo = prompt("Novo nome (em PT):", velho);
            if(novo) { await _supabase.from('condominio_verde').update({propriedade: novo}).eq('propriedade', velho); carregarTudo(); }
        }

        async function atualizarStatus(id, mes, el) {
            await _supabase.from('condominio_verde').update({ [mes]: el.value }).eq('id', id);
            carregarTudo();
        }

        async function salvar(id, campo, el) {
            await _supabase.from('condominio_verde').update({ [campo]: el.innerText }).eq('id', id);
        }

        async function salvarNotasNoSB(txt) {
            await _supabase.from('notas_config').update({ texto_notas: txt }).eq('id', 1);
        }

        async function carregarNotasDoSB() {
            let { data } = await _supabase.from('notas_config').select('texto_notas').eq('id', 1).single();
            if(data) document.getElementById('notas-gerais-textarea').value = data.texto_notas;
        }

        function alternarIdioma() {
            idiomaAtual = idiomaAtual === 'pt' ? 'de' : 'pt';
            document.getElementById('btn-lang').innerText = idiomaAtual === 'pt' ? 'DEUTSCH 🇩🇪' : 'PORTUGUÊS 🇵🇹';
            carregarTudo();
        }
    </script>
</body>
</html>
